name: Apply Firebase modular auth fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore(ci): add one-time Firebase modular API fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix Firebase updateProfile usage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/main.tsx')
          s = p.read_text()
          s = s.replace('credential.user.updateProfile({displayName:displayName.trim()})', 'updateProfile(credential.user,{displayName:displayName.trim()})')
          s = s.replace('createUserWithEmailAndPassword, getAuth, sendEmailVerification, setPersistence, signInWithEmailAndPassword, signOut, browserSessionPersistence', 'createUserWithEmailAndPassword, getAuth, sendEmailVerification, setPersistence, signInWithEmailAndPassword, signOut, browserSessionPersistence, updateProfile')
          p.write_text(s)
          PY
          grep -q 'updateProfile(credential.user' apps/web/src/main.tsx
      - name: Commit and remove temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/main.tsx
          git rm -f .github/workflows/fix-firebase-update-profile.yml .github/workflows/run-firebase-modular-fix.yml
          git commit -m 'fix(web): use modular Firebase updateProfile'
          git push
