name: Production Migration 111 (Controlled)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type APPLY-MIGRATION-111 to authorize the one-time production migration"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate-111:
    if: ${{ inputs.confirm == 'APPLY-MIGRATION-111' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-migration
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate production migration secret
        env:
          DATABASE_URL: ${{ secrets.RUPAYKG_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || {
            echo "RUPAYKG_MIGRATION_DATABASE_URL is required."
            exit 1
          }

      - name: Install production migration dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify approved migration-owner preflight
        env:
          DATABASE_URL: ${{ secrets.RUPAYKG_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          row="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            select current_user,
                   (select rolsuper from pg_roles where rolname=current_user),
                   (select rolbypassrls from pg_roles where rolname=current_user),
                   pg_has_role(current_user, 'rupaykg_ddl', 'SET');
          ")"
          echo "$row" | tee migration-owner-preflight.txt
          IFS='|' read -r role is_super bypass_rls can_set <<< "$row"
          test "$role" = "rupaykg"
          test "$is_super" = "f"
          test "$bypass_rls" = "f"
          test "$can_set" = "t"

      - name: Verify migration 111 is the only pending migration
        env:
          DATABASE_URL: ${{ secrets.RUPAYKG_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readdir } from "node:fs/promises";
          import { existsSync } from "node:fs";
          import path from "node:path";
          import { Pool } from "pg";

          const databaseUrl = process.env.DATABASE_URL;
          const here = process.cwd();
          const migrationDir = [path.resolve(here, "migrations")].find(existsSync);
          if (!migrationDir) throw new Error("Migration directory not found");

          const files = (await readdir(migrationDir))
            .filter((name) => /^\d+_.+\.sql$/.test(name))
            .sort();
          const seenVersions = new Map();
          const expected = files.map((filename) => {
            const version = filename.slice(0, filename.indexOf("_"));
            const prior = seenVersions.get(version);
            if (prior) throw new Error(`Duplicate migration version ${version}: ${prior} and ${filename}`);
            seenVersions.set(version, filename);
            return { version, filename };
          });

          const pool = new Pool({ connectionString: databaseUrl, max: 1, ssl: { rejectUnauthorized: false } });
          try {
            const { rows } = await pool.query("select version, filename from public.schema_migrations");
            const applied = new Map(rows.map((row) => [row.version, row.filename]));
            const pending = expected.filter(({ version, filename }) => applied.get(version) !== filename);
            if (pending.length !== 1 ||
                pending[0].version !== "111" ||
                pending[0].filename !== "111_shakti_mrv_provenance_tenant_rls.sql") {
              throw new Error("Refusing production migration: migration 111 is not the only pending migration.");
            }
            console.log("PASS: migration 111 is the only pending migration.");
          } finally {
            await pool.end();
          }
          NODE

      - name: Run protected migration 111
        env:
          DATABASE_URL: ${{ secrets.RUPAYKG_MIGRATION_DATABASE_URL }}
          RUPAYKG_ALLOW_PROTECTED_SHAKTI_MIGRATIONS: "1"
        run: |
          set -euo pipefail
          npm run migrate -w @rupaykg/api

      - name: Verify migration ledger and ownership
        env:
          DATABASE_URL: ${{ secrets.RUPAYKG_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from public.schema_migrations where version='111' and filename='111_shakti_mrv_provenance_tenant_rls.sql'")" = "1"
          test "$(psql "$DATABASE_URL" -Atc "select pg_get_userbyid(relowner) from pg_class where oid='public.mrv_provenance_events'::regclass")" = "rupaykg_ddl"
          echo "PASS: migration 111 ledger and provenance ownership verified."

      - name: Upload non-secret evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-migration-111-evidence-${{ github.run_id }}
          path: migration-owner-preflight.txt
          if-no-files-found: error
          retention-days: 30
