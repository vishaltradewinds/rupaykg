name: Tenant Isolation Live Acceptance

on:
  workflow_dispatch:

jobs:
  tenant-isolation-acceptance:
    name: PostgreSQL runtime tenant-isolation acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RUPAYKG_RUNTIME_DATABASE_URL: ${{ secrets.RUPAYKG_RUNTIME_DATABASE_URL }}
      RUPAYKG_DDL_DATABASE_URL: ${{ secrets.RUPAYKG_DDL_DATABASE_URL }}
    steps:
      - name: Checkout authoritative repository
        uses: actions/checkout@v4

      - name: Validate acceptance database secrets
        run: |
          set -euo pipefail
          if [ -z "${RUPAYKG_RUNTIME_DATABASE_URL:-}" ]; then
            echo "RUPAYKG_RUNTIME_DATABASE_URL is required."
            exit 1
          fi
          if [ -z "${RUPAYKG_DDL_DATABASE_URL:-}" ]; then
            echo "RUPAYKG_DDL_DATABASE_URL is required."
            exit 1
          fi

      - name: Verify Shakti migration baseline
        run: |
          set -euo pipefail
          mkdir -p tenant-isolation-evidence
          psql "$RUPAYKG_DDL_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "select current_database() as database, current_user as user_name, session_user as session_user;" \
            -c "select version, filename, applied_at from schema_migrations where version in ('097','098','099') order by version;" \
            2>&1 | tee tenant-isolation-evidence/migration-baseline.txt
          for version in 097 098 099; do
            if ! grep -q "^ *${version} *|" tenant-isolation-evidence/migration-baseline.txt; then
              echo "Required Shakti migration ${version} is not applied to the acceptance database."
              exit 1
            fi
          done

      - name: Verify runtime and DDL target identity match
        run: |
          set -euo pipefail
          mkdir -p tenant-isolation-evidence
          runtime_fingerprint="$(
            psql "$RUPAYKG_RUNTIME_DATABASE_URL" \
              -At -v ON_ERROR_STOP=1 \
              -c "select current_database() || '|' || coalesce(inet_server_addr()::text,'local') || '|' || inet_server_port() || '|' || current_setting('server_version_num');"
          )"
          ddl_fingerprint="$(
            psql "$RUPAYKG_DDL_DATABASE_URL" \
              -At -v ON_ERROR_STOP=1 \
              -c "select current_database() || '|' || coalesce(inet_server_addr()::text,'local') || '|' || inet_server_port() || '|' || current_setting('server_version_num');"
          )"
          printf 'runtime_target=%s\n' "$runtime_fingerprint" | tee tenant-isolation-evidence/runtime-ddl-target.txt
          printf 'ddl_target=%s\n' "$ddl_fingerprint" | tee -a tenant-isolation-evidence/runtime-ddl-target.txt
          if [ "$runtime_fingerprint" != "$ddl_fingerprint" ]; then
            echo "Runtime and controlled DDL connections do not target the same PostgreSQL endpoint."
            exit 1
          fi

      - name: Verify controlled DDL role preflight
        run: |
          set -euo pipefail
          mkdir -p tenant-isolation-evidence
          psql "$RUPAYKG_DDL_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f ops/tenant-isolation/VERIFY_DDL_ROLE_PRE_RLS.sql \
            2>&1 | tee tenant-isolation-evidence/ddl-role-preflight.txt

      - name: Verify authentication bootstrap contract
        run: |
          set -euo pipefail
          mkdir -p tenant-isolation-evidence
          psql "$RUPAYKG_RUNTIME_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f ops/tenant-isolation/VERIFY_AUTH_BOOTSTRAP.sql \
            2>&1 | tee tenant-isolation-evidence/auth-bootstrap.txt

      - name: Verify SECURITY DEFINER tenant boundaries
        run: |
          set -euo pipefail
          mkdir -p tenant-isolation-evidence
          psql "$RUPAYKG_RUNTIME_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f ops/tenant-isolation/VERIFY_SECURITY_DEFINER_BOUNDARIES.sql \
            2>&1 | tee tenant-isolation-evidence/security-definer-boundaries.txt

      - name: Verify runtime role and pre-RLS contract
        run: |
          set -euo pipefail
          mkdir -p tenant-isolation-evidence
          psql "$RUPAYKG_RUNTIME_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f ops/tenant-isolation/VERIFY_PRE_RLS.sql \
            2>&1 | tee tenant-isolation-evidence/pre-rls.txt

      - name: Verify RLS policy coverage
        run: |
          set -euo pipefail
          psql "$RUPAYKG_RUNTIME_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f ops/tenant-isolation/VERIFY_RLS_POLICY_COVERAGE.sql \
            2>&1 | tee tenant-isolation-evidence/rls-policy-coverage.txt

      - name: Verify RLS is active and cross-tenant access is denied
        run: |
          set -euo pipefail
          psql "$RUPAYKG_DDL_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -f ops/tenant-isolation/VERIFY_RLS_NEGATIVE_TEST.sql \
            2>&1 | tee tenant-isolation-evidence/rls-negative-test.txt

      - name: Record acceptance metadata
        run: |
          set -euo pipefail
          {
            echo "repository=vishaltradewinds/rupaykg"
            echo "commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "workflow_attempt=$GITHUB_RUN_ATTEMPT"
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > tenant-isolation-evidence/acceptance-metadata.txt

      - name: Upload tenant isolation acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-isolation-live-acceptance-${{ github.run_id }}
          path: tenant-isolation-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Acceptance result
        run: |
          echo "TENANT ISOLATION LIVE ACCEPTANCE PASSED."
          echo "Evidence: Shakti migrations 097-099 + non-BYPASSRLS runtime role + required privileges + RLS enabled + cross-tenant read/mutate denial."
          echo "Evidence artifact: tenant-isolation-live-acceptance-${GITHUB_RUN_ID}"
