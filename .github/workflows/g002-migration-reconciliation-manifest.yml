name: G-002 migration reconciliation manifest

on:
  push:
    branches:
      - cto/g002-authority-reconciliation-20261107

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/g002-reconciliation-manifest.mjs
      - name: Commit deterministic manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/G002_PRIMARY_MIGRATION_RECONCILIATION_MANIFEST_20261107.json
          git diff --cached --quiet && exit 0
          git commit -m "docs: generate deterministic G-002 migration reconciliation manifest"
          git push origin HEAD:cto/g002-authority-reconciliation-20261107
