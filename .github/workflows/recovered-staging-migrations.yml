name: Recovered staging migration validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/audit/evidence/recovered-staging-migrations/**'
      - 'scripts/validate-recovered-staging-migrations.sh'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  validate-recovered-sources:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply recovered sources and verify constraints in disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash scripts/validate-recovered-staging-migrations.sh
