name: OTEL Runtime Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  otel-runtime-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run runtime acceptance probe
        env:
          RUPAYKG_BASE_URL: ${{ secrets.RUPAYKG_BASE_URL }}
          RUPAYKG_BEARER_TOKEN: ${{ secrets.RUPAYKG_BEARER_TOKEN }}
          RUPAYKG_ORGANIZATION_ID: ${{ secrets.RUPAYKG_ORGANIZATION_ID }}
        run: |
          test -n "$RUPAYKG_BASE_URL"
          test -n "$RUPAYKG_BEARER_TOKEN"
          test -n "$RUPAYKG_ORGANIZATION_ID"
          node ops/observability/OTEL_RUNTIME_ACCEPTANCE.mjs | tee otel-runtime-acceptance.json

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: rupaykg-otel-runtime-acceptance
          path: otel-runtime-acceptance.json
          if-no-files-found: error
