name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
  DATABASE_SSL: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:migrations
      - name: Generate and validate migration manifest
        run: |
          mkdir -p artifacts
          npm run generate:migration-manifest -- artifacts/migration-manifest.json
          MIGRATOR_MANIFEST_PATH=artifacts/migration-manifest.json npm run validate:migration-manifest
      - name: Validate protected migrator configuration contract
        env:
          DATABASE_URL: ""
          MIGRATOR_DATABASE_URL: postgresql://protected-migrator.invalid/rupaykg
          MIGRATOR_MODE: "true"
          NODE_ENV: production
          MIGRATOR_MANIFEST_PATH: artifacts/migration-manifest.json
          MIGRATOR_EXPECTED_DATABASE: rupaykg
          MIGRATOR_EXPECTED_USER: rupaykg_migrator
          DATABASE_SSL_CA_CERT: /tmp/ci-placeholder-ca.pem
          MIGRATOR_DATABASE_SSL_STRICT: "true"
        run: npm run validate:protected-migrator-config
      - name: Apply migrations to disposable CI PostgreSQL
        env:
          DATABASE_URL: ""
          MIGRATOR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
          MIGRATOR_MODE: "true"
          NODE_ENV: production
          MIGRATOR_MANIFEST_PATH: artifacts/migration-manifest.json
          MIGRATOR_EXPECTED_DATABASE: rupaykg
          MIGRATOR_EXPECTED_USER: postgres
          MIGRATOR_REHEARSAL: "true"
          MIGRATOR_DATABASE_SSL_STRICT: "false"
          DATABASE_SSL_CA_CERT: /tmp/ci-placeholder-ca.pem
        run: npm run migrate:protected
      - name: Verify orphaned migration ledger fails closed
        env:
          MIGRATOR_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
          MIGRATOR_DATABASE_SSL: "false"
        run: bash scripts/test-migrator-orphan-ledger.sh
      - name: Prove non-superuser migration helper ownership transfer
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=scripts/test-migrator-helper-ownership.sql
      - name: Rehearse verification migration over legacy trigger names
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=scripts/test-verification-migration-reapply.sql
      - name: Prove authenticated verification context convergence
        run: psql "$DATABASE_URL" --set=ON_ERROR_STOP=1 --file=scripts/test-authenticated-verification-context.sql
      - name: Rehearse geography revocation versus verification approval concurrency
        run: bash scripts/test-verification-geography-concurrency.sh
      - run: npm run typecheck
      - run: npm run build
      - name: Browser smoke test production web build
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -w @rupaykg/web -- --host 127.0.0.1 --port 4173 > /tmp/rupaykg-web-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          html="$(curl --fail --silent http://127.0.0.1:4173/)"
          grep -q 'id="root"' <<<"$html"
          grep -q 'assets/' <<<"$html"
          grep -q 'stakeholder-journey.js' <<<"$html"
          set +e
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome --dump-dom --virtual-time-budget=2000 http://127.0.0.1:4173/ > /tmp/rupaykg-web-dom.html 2>/tmp/rupaykg-chrome-dom.err
          dom_status=$?
          cat /tmp/rupaykg-chrome-dom.err
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome-shot --hide-scrollbars --window-size=1440,1200 --screenshot=/tmp/rupaykg-web-smoke.png --virtual-time-budget=2000 http://127.0.0.1:4173/ >/tmp/rupaykg-chrome-shot.out 2>&1
          shot_status=$?
          cat /tmp/rupaykg-chrome-shot.out
          set -e
          test -s /tmp/rupaykg-web-dom.html
          grep -q 'RupayKG' /tmp/rupaykg-web-dom.html
          test -s /tmp/rupaykg-web-smoke.png
          echo "Chrome DOM exit: $dom_status; screenshot exit: $shot_status"
      - name: Run tests including disposable PostgreSQL acceptance
        env:
          RUPAYKG_RUN_DB_INTEGRATION_TESTS: "1"
        run: npm test
      - name: Build production container
        run: docker build --pull --tag rupaykg:ci .
      - name: Assert production startup cannot execute migrations or fixtures
        shell: bash
        run: |
          set -euo pipefail
          command="$(docker image inspect rupaykg:ci --format '{{json .Config.Cmd}}')"
          test "$command" = '["node","apps/dist/src/production-server.js"]'
          echo "Verified production container starts only the API server."
