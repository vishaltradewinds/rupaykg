name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
  DATABASE_SSL: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Verify Guardian policy generation is reproducible
        run: npm run test:guardian-policy
      - name: Build and validate review-only Guardian policy artifact
        env:
          SOURCE_DATE_EPOCH: "1743033600"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-wa03-guardian-policy.mjs
          python3 - <<'PY'
          import datetime, hashlib, pathlib, zipfile
          root = pathlib.Path("guardian-policies/WA03.001")
          output = pathlib.Path("guardian-policies/RupayKg-WA03.001-v1.policy")
          epoch = 1743033600
          dt = datetime.datetime.fromtimestamp(epoch, datetime.timezone.utc)
          stamp = (max(dt.year, 1980), dt.month, dt.day, dt.hour, dt.minute, dt.second // 2 * 2)
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for file in sorted(p for p in root.rglob("*") if p.is_file()):
                  info = zipfile.ZipInfo(file.relative_to(root).as_posix(), date_time=stamp)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, file.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          with zipfile.ZipFile(output) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit("Corrupt Guardian package member: " + bad)
              names = archive.namelist()
              if "policy.json" not in names or not any(n.startswith("schemas/") and n.endswith(".json") for n in names):
                  raise SystemExit("Guardian package missing policy.json or schema JSON")
          print("Review-only policy artifact SHA-256:", hashlib.sha256(output.read_bytes()).hexdigest())
          print("Package entries:", len(names))
          PY
      - name: Upload review-only Guardian policy artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-wa03-001-review-only
          path: guardian-policies/RupayKg-WA03.001-v1.policy
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated Guardian source for reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: guardian-wa03-001-generated-source-review
          path: |
            guardian-policies/WA03.001/README.md
            guardian-policies/WA03.001/policy.json
            guardian-policies/WA03.001/schemas/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Compare generated Guardian source with tracked source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- guardian-policies/WA03.001; then
            echo "Generated Guardian source matches tracked source."
          else
            echo "::notice title=Guardian artifact reconciliation required::Generated policy source differs from tracked files. Review the generated-source artifact; tracked source was not overwritten."
            git diff --stat -- guardian-policies/WA03.001
            git diff --numstat -- guardian-policies/WA03.001
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:migrations
      - run: npm run migrate -w @rupaykg/api
      - run: npm run typecheck
      - run: npm run build
      - name: API runtime smoke test route registration and database readiness
        shell: bash
        run: |
          set -euo pipefail
          node apps/dist/src/server.js > /tmp/rupaykg-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          status=""
          for attempt in {1..30}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/health || true)"
            if [ "$status" = "200" ]; then break; fi
            sleep 1
          done
          if [ "$status" != "200" ]; then
            cat /tmp/rupaykg-api.log
            echo "API health check returned $status; expected 200"
            exit 1
          fi
          for route in /api/v1/auth/me /api/v1/statutory/epr/schemes /api/v1/epr/returns; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3000$route")"
            if [ "$status" != "401" ]; then
              cat /tmp/rupaykg-api.log
              echo "$route returned $status; expected 401 for an unauthenticated request"
              exit 1
            fi
          done
      - name: Browser smoke test production web build
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -w @rupaykg/web -- --host 127.0.0.1 --port 4173 > /tmp/rupaykg-web-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          html="$(curl --fail --silent http://127.0.0.1:4173/)"
          grep -q 'id="root"' <<<"$html"
          grep -q 'assets/' <<<"$html"
          grep -q 'stakeholder-journey.js' <<<"$html"
          set +e
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome --dump-dom --virtual-time-budget=2000 http://127.0.0.1:4173/ > /tmp/rupaykg-web-dom.html 2>/tmp/rupaykg-chrome-dom.err
          dom_status=$?
          cat /tmp/rupaykg-chrome-dom.err
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome-shot --hide-scrollbars --window-size=1440,1200 --screenshot=/tmp/rupaykg-web-smoke.png --virtual-time-budget=2000 http://127.0.0.1:4173/ >/tmp/rupaykg-chrome-shot.out 2>&1
          shot_status=$?
          cat /tmp/rupaykg-chrome-shot.out
          set -e
          test -s /tmp/rupaykg-web-dom.html
          grep -q 'RupayKG' /tmp/rupaykg-web-dom.html
          test -s /tmp/rupaykg-web-smoke.png
          echo "Chrome DOM exit: $dom_status; screenshot exit: $shot_status"
      - name: Run tests including disposable PostgreSQL acceptance
        env:
          RUPAYKG_RUN_DB_INTEGRATION_TESTS: "1"
        run: npm test
      - name: Build production container
        run: docker build --pull --tag rupaykg:ci .
