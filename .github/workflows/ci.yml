name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
  DATABASE_SSL: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:migrations
      - run: npm run migrate -w @rupaykg/api
      - name: Verify applied migrations against repository inventory
        run: npm run verify:migration-state -w @rupaykg/api
      - run: npm run typecheck
      - run: npm run build
      - name: Browser smoke test production web build
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -w @rupaykg/web -- --host 127.0.0.1 --port 4173 > /tmp/rupaykg-web-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          html="$(curl --fail --silent http://127.0.0.1:4173/)"
          grep -q 'id="root"' <<<"$html"
          grep -q 'assets/' <<<"$html"
          grep -q 'stakeholder-journey.js' <<<"$html"
          set +e
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome --dump-dom --virtual-time-budget=2000 http://127.0.0.1:4173/ > /tmp/rupaykg-web-dom.html 2>/tmp/rupaykg-chrome-dom.err
          dom_status=$?
          cat /tmp/rupaykg-chrome-dom.err
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome-shot --hide-scrollbars --window-size=1440,1200 --screenshot=/tmp/rupaykg-web-smoke.png --virtual-time-budget=2000 http://127.0.0.1:4173/ >/tmp/rupaykg-chrome-shot.out 2>&1
          shot_status=$?
          cat /tmp/rupaykg-chrome-shot.out
          set -e
          test -s /tmp/rupaykg-web-dom.html
          grep -q 'RupayKG' /tmp/rupaykg-web-dom.html
          test -s /tmp/rupaykg-web-smoke.png
          echo "Chrome DOM exit: $dom_status; screenshot exit: $shot_status"
      - name: Prepare isolated PostgreSQL acceptance databases
        env:
          CI_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          node scripts/create-ci-test-databases.mjs
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rupaykg_baseline_test npm run migrate -w @rupaykg/api
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rupaykg_cpcb_test npm run migrate -w @rupaykg/api
      - name: Run tests including disposable PostgreSQL acceptance
        env:
          RUPAYKG_RUN_DB_INTEGRATION_TESTS: "1"
          RUPAYKG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg_baseline_test
          RUPAYKG_CPCB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg_cpcb_test
          RUPAYKG_MIGRATION_RACE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg_migration_race_test
        run: npm test
      - name: Verify audit chain using read-only PostgreSQL session
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg_baseline_test
          DATABASE_SSL: "false"
        run: npm run verify:audit-chain -w @rupaykg/api
      - name: Backup disposable audit-chain database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg_baseline_test
        shell: bash
        run: pg_dump --format=custom --no-owner --no-acl --file=/tmp/rupaykg-audit-chain.dump "$DATABASE_URL"
      - name: Restore backup to a fresh disposable database and verify chain
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg_audit_restore_test
          DATABASE_SSL: "false"
        shell: bash
        run: |
          set -euo pipefail
          createdb --host=localhost --username=postgres rupaykg_audit_restore_test
          pg_restore --exit-on-error --no-owner --no-acl --dbname="$DATABASE_URL" /tmp/rupaykg-audit-chain.dump
          npm run verify:audit-chain -w @rupaykg/api
      - name: Build production container
        run: docker build --pull --tag rupaykg:ci .
