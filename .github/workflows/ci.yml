name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
  DATABASE_SSL: "false"
  RUPAYKG_ALLOW_PROTECTED_SHAKTI_MIGRATIONS: "1"
  RUPAYKG_REQUIRE_NON_BYPASSRLS: "1"
  RUPAYKG_TEST_OWNER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Assert disposable non-BYPASSRLS runtime role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create role rupaykg_app_runtime nologin nobypassrls;"
          test "$(psql "$DATABASE_URL" -tAc "select rolbypassrls from pg_roles where rolname = 'rupaykg_app_runtime'")" = "f"
      - run: npm run validate:migrations
      - run: npm run migrate -w @rupaykg/api
      - run: npm run typecheck
      - run: npm run build
      - name: Browser smoke test production web build
        shell: bash
        run: |
      - name: Rehearse migration 101 as restricted non-superuser migration owner
        env:
          MIGRATION_FILE: migrations/101_shakti_mrv_provenance_tenant_rls.sql
        run: bash ops/tenant-isolation/VERIFY_MIGRATION_OWNER_ACCEPTANCE.sh
          set -euo pipefail
          npm run preview -w @rupaykg/web -- --host 127.0.0.1 --port 4173 > /tmp/rupaykg-web-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          html="$(curl --fail --silent http://127.0.0.1:4173/)"
          grep -q 'id="root"' <<<"$html"
          grep -q 'assets/' <<<"$html"
          grep -q 'stakeholder-journey.js' <<<"$html"
          set +e
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome --dump-dom --virtual-time-budget=2000 http://127.0.0.1:4173/ > /tmp/rupaykg-web-dom.html 2>/tmp/rupaykg-chrome-dom.err
          dom_status=$?
          cat /tmp/rupaykg-chrome-dom.err
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome-shot --hide-scrollbars --window-size=1440,1200 --screenshot=/tmp/rupaykg-web-smoke.png --virtual-time-budget=2000 http://127.0.0.1:4173/ >/tmp/rupaykg-chrome-shot.out 2>&1
          shot_status=$?
          cat /tmp/rupaykg-chrome-shot.out
          set -e
          test -s /tmp/rupaykg-web-dom.html
          grep -q 'RupayKG' /tmp/rupaykg-web-dom.html
          test -s /tmp/rupaykg-web-smoke.png
          echo "Chrome DOM exit: $dom_status; screenshot exit: $shot_status"
      - name: Run tests including disposable PostgreSQL acceptance
        env:
          RUPAYKG_RUN_DB_INTEGRATION_TESTS: "1"
        run: npm test
      - name: Rehearse production DDL acceptance login, RLS activation and cross-tenant isolation
        shell: bash
        run: |
          set -euo pipefail
          # Disposable CI-only credential. Production uses a separately provisioned
          # secret and the exact same SQL wrappers; no CI password is reused.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE rupaykg_ddl_login LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD 'ci-only-acceptance-password'; GRANT rupaykg_ddl TO rupaykg_ddl_login WITH INHERIT FALSE, SET TRUE; GRANT rupaykg_app_runtime TO rupaykg_ddl_login WITH INHERIT FALSE, SET TRUE;"
          export PGPASSWORD=ci-only-acceptance-password
          DDL_DATABASE_URL="postgresql://rupaykg_ddl_login@localhost:5432/rupaykg"
          psql "$DDL_DATABASE_URL" -v ON_ERROR_STOP=1 -f ops/tenant-isolation/VERIFY_DDL_ROLE_WRAPPER.sql
          psql "$DDL_DATABASE_URL" -v ON_ERROR_STOP=1 -f ops/tenant-isolation/VERIFY_RUNTIME_PRE_RLS_WRAPPER.sql
          psql "$DDL_DATABASE_URL" -v ON_ERROR_STOP=1 -f ops/tenant-isolation/ACTIVATE_RLS_WRAPPER.sql
          psql "$DDL_DATABASE_URL" -v ON_ERROR_STOP=1 -f ops/tenant-isolation/VERIFY_RLS_POLICY_COVERAGE_WRAPPER.sql
          psql "$DDL_DATABASE_URL" -v ON_ERROR_STOP=1 -f ops/tenant-isolation/VERIFY_RLS_NEGATIVE_TEST.sql
          unset PGPASSWORD
      - name: Build production container
        run: docker build --pull --tag rupaykg:ci .
