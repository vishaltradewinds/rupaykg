name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
  DATABASE_SSL: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:migrations
      - run: npm run migrate -w @rupaykg/api
      - run: npm run typecheck
      - run: npm run build
      - name: Browser smoke test production web build
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -w @rupaykg/web -- --host 127.0.0.1 --port 4173 > /tmp/rupaykg-web-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          npx --yes playwright@1.55.0 install --with-deps chromium
          npm install --global @playwright/cli@latest
          playwright-cli open http://127.0.0.1:4173/
          playwright-cli snapshot --filename=/tmp/rupaykg-web-snapshot.yml
          playwright-cli eval '() => document.body.innerText.trim().length > 0 ? "HAS_CONTENT" : "BLANK"'
          playwright-cli eval '() => document.querySelector("[data-nextjs-dialog], .vite-error-overlay, #webpack-dev-server-client-overlay") ? "ERROR_OVERLAY" : "OK"'
          playwright-cli screenshot --filename=/tmp/rupaykg-web-smoke.png
          grep -q "RupayKG" /tmp/rupaykg-web-snapshot.yml
          grep -q "STAKEHOLDER LOGIN" /tmp/rupaykg-web-snapshot.yml
          playwright-cli close
      - run: npm test
      - name: Build production container
        run: docker build --pull --tag rupaykg:ci .
