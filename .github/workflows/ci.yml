name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
  DATABASE_SSL: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:migrations
      - run: npm run migrate -w @rupaykg/api
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Build production container
        run: docker build --pull --tag rupaykg:ci .
