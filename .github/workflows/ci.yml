name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
  DATABASE_SSL: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:migrations
      - name: Provision restricted verifier owner in disposable CI PostgreSQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE rupaykg_security_definer
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CREATE ON DATABASE rupaykg TO rupaykg_security_definer;
          GRANT rupaykg_security_definer TO postgres;
          CREATE ROLE rupaykg_bootstrap_owner
            NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS NOREPLICATION;
          GRANT CREATE ON DATABASE rupaykg TO rupaykg_bootstrap_owner;
          GRANT rupaykg_bootstrap_owner TO postgres WITH ADMIN OPTION;
          SQL
      - run: npm run migrate -w @rupaykg/api
      - name: Verify bootstrap owner temporary privileges are revoked
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $assert_bootstrap_owner$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM pg_catalog.pg_auth_members m
               WHERE m.roleid = (SELECT oid FROM pg_catalog.pg_roles WHERE rolname = 'rupaykg_bootstrap_owner')
                 AND m.member = (SELECT oid FROM pg_catalog.pg_roles WHERE rolname = 'postgres')
            ) THEN
              RAISE EXCEPTION 'bootstrap owner direct membership must be revoked after migration';
            END IF;
            IF pg_catalog.has_database_privilege('rupaykg_bootstrap_owner', current_database(), 'CREATE') THEN
              RAISE EXCEPTION 'bootstrap owner database CREATE must be revoked after migration';
            END IF;
          END
          $assert_bootstrap_owner$;
          SQL
      - name: Provision synthetic bootstrap custodians in disposable CI PostgreSQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE rupaykg_bootstrap_custodian_a LOGIN
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS NOREPLICATION;
          CREATE ROLE rupaykg_bootstrap_custodian_b LOGIN
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS NOREPLICATION;
          GRANT rupaykg_bootstrap_custodian TO rupaykg_bootstrap_custodian_a WITH INHERIT FALSE, SET TRUE;
          GRANT rupaykg_bootstrap_custodian TO rupaykg_bootstrap_custodian_b WITH INHERIT FALSE, SET TRUE;
          SQL
      - run: npm run typecheck
      - run: npm run build
      - name: Validate RupayKg reference-aligned landing UX
        run: node scripts/validate-rupaykg-landing-ux.mjs
      - name: Exercise two-custodian bootstrap with synthetic CI identities and secrets
        env:
          RUPAYKG_RUN_DB_INTEGRATION_TESTS: "1"
        run: node apps/dist/src/ci-platform-authority-bootstrap.js
      - name: Browser smoke test production web build
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -w @rupaykg/web -- --host 127.0.0.1 --port 4173 > /tmp/rupaykg-web-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          html="$(curl --fail --silent http://127.0.0.1:4173/)"
          grep -q 'id="root"' <<<"$html"
          grep -q 'assets/' <<<"$html"
          grep -q 'stakeholder-journey.js' <<<"$html"
          set +e
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome --dump-dom --virtual-time-budget=2000 http://127.0.0.1:4173/ > /tmp/rupaykg-web-dom.html 2>/tmp/rupaykg-chrome-dom.err
          dom_status=$?
          cat /tmp/rupaykg-chrome-dom.err
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome-shot --hide-scrollbars --window-size=1440,1200 --screenshot=/tmp/rupaykg-web-smoke.png --virtual-time-budget=2000 http://127.0.0.1:4173/ >/tmp/rupaykg-chrome-shot.out 2>&1
          shot_status=$?
          cat /tmp/rupaykg-chrome-shot.out
          set -e
          test -s /tmp/rupaykg-web-dom.html
          grep -q 'RupayKG' /tmp/rupaykg-web-dom.html
          grep -q 'Make every waste and resource movement traceable.' /tmp/rupaykg-web-dom.html
          grep -q 'Stakeholders' /tmp/rupaykg-web-dom.html
          grep -q 'How it works' /tmp/rupaykg-web-dom.html
          grep -q 'Compliance' /tmp/rupaykg-web-dom.html
          if grep -q 'aria-label="Account access"' /tmp/rupaykg-web-dom.html; then echo 'Account drawer must not obscure initial landing page' >&2; exit 1; fi
          test -s /tmp/rupaykg-web-smoke.png
          echo "Chrome DOM exit: $dom_status; screenshot exit: $shot_status"
      - name: Upload landing UX browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rupaykg-landing-ux
          path: |
            /tmp/rupaykg-web-smoke.png
            /tmp/rupaykg-web-dom.html
          if-no-files-found: warn
          retention-days: 7
      - name: Run tests including disposable PostgreSQL acceptance
        env:
          RUPAYKG_RUN_DB_INTEGRATION_TESTS: "1"
        run: npm test
      - name: Build production container
        run: docker build --pull --tag rupaykg:ci .
