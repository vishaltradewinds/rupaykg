name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, cto/20261107-protected-migration-ci]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
  DATABASE_SSL: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:migrations
      - name: Provision disposable Shakti runtime role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create role rupaykg_app_runtime nologin nobypassrls"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter role rupaykg_app_runtime login password 'ci-runtime-only-password'"
      - name: Assert disposable runtime role security posture
        shell: bash
        run: |
          set -euo pipefail
          role_flags="$(psql "$DATABASE_URL" -Atc "select rolsuper::int || ':' || rolbypassrls::int || ':' || rolcreaterole::int || ':' || rolcreatedb::int || ':' || rolcanlogin::int from pg_roles where rolname = 'rupaykg_app_runtime'")"
          echo "rupaykg_app_runtime flags: $role_flags"
          test "$role_flags" = "0:0:0:0:1"
      - name: Run migrations with explicit protected-Shakti test gate
        env:
          RUPAYKG_ALLOW_PROTECTED_SHAKTI_MIGRATIONS: "1"
        run: npm run migrate -w @rupaykg/api
      - name: Assert pre-tenant identity context is installed in disposable CI DB
        run: |
          identity_context_exists="$(psql "$DATABASE_URL" -Atc "select exists (select 1 from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'app' and p.proname = 'set_identity_context')")"
          echo "app.set_identity_context exists: $identity_context_exists"
          test "$identity_context_exists" = "t"
      - name: Assert protected Shakti core RLS is active in disposable CI DB
        run: |
          protected_rls="$(psql "$DATABASE_URL" -Atc "select (count(*) = 7 and bool_and(c.relrowsecurity))::int from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('activities','measurements','evidence','carbon_calculations','epr_obligations','settlements','settlement_events')")"
          echo "Protected Shakti core RLS active: $protected_rls"
          test "$protected_rls" = "1"
      - run: npm run typecheck
      - run: npm run build
      - name: Browser smoke test production web build
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -w @rupaykg/web -- --host 127.0.0.1 --port 4173 > /tmp/rupaykg-web-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          html="$(curl --fail --silent http://127.0.0.1:4173/)"
          grep -q 'id="root"' <<<"$html"
          grep -q 'assets/' <<<"$html"
          grep -q 'stakeholder-journey.js' <<<"$html"
          set +e
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome --dump-dom --virtual-time-budget=2000 http://127.0.0.1:4173/ > /tmp/rupaykg-web-dom.html 2>/tmp/rupaykg-chrome-dom.err
          dom_status=$?
          cat /tmp/rupaykg-chrome-dom.err
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome-shot --hide-scrollbars --window-size=1440,1200 --screenshot=/tmp/rupaykg-web-smoke.png --virtual-time-budget=2000 http://127.0.0.1:4173/ >/tmp/rupaykg-chrome-shot.out 2>&1
          shot_status=$?
          cat /tmp/rupaykg-chrome-shot.out
          set -e
          test -s /tmp/rupaykg-web-dom.html
          grep -q 'RupayKG' /tmp/rupaykg-web-dom.html
          test -s /tmp/rupaykg-web-smoke.png
          echo "Chrome DOM exit: $dom_status; screenshot exit: $shot_status"
      - name: Run Batch E disposable policy contract
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/test-shakti-batch-e-policy-contract.sql
      - name: Run tenant-route transaction boundary contract
        run: node scripts/test-shakti-tenant-route-contract.mjs
      - name: Run Shakti operational invariants contract
        run: node scripts/test-shakti-operational-invariants.mjs
      - name: Run Shakti core RLS contract
        run: node scripts/test-shakti-core-rls-contract.mjs
      - name: Run disposable Shakti RLS policy runtime contract
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/test-shakti-rls-policy-runtime-contract.sql
      - name: Run platform-admin authorization contract
        run: node scripts/test-shakti-platform-admin-authorization-contract.mjs
      - name: Run multi-party authorization contract
        run: node scripts/test-shakti-multi-party-authorization-contract.mjs
      - name: Run registry tenant-boundary contract
        shell: bash
        run: |
          set -euo pipefail
          registry="apps/src/registry-routes.ts"
          test "$(grep -c 'withTenantTransaction(pool' "$registry")" -ge 8
          ! grep -q 'pool\.query\|pool\.connect' "$registry"
          for route in "/api/v1/settlements" "/api/v1/settlements/:settlementId/authorize" "/api/v1/settlements/:settlementId/settle" "/api/v1/settlements/:settlementId/confirm"; do
            grep -Fq "app.post(\"$route\"" "$registry"
          done
          grep -Fq 'canActForOrganization(auth,payerId)' "$registry"
          grep -Fq 'canActForOrganization(auth,payeeId)' "$registry"
          grep -Fq 'payerId!==currentOwner' "$registry"
          echo "Shakti registry tenant-boundary contract PASSED: registry mutations remain transaction-bound and settlement authorization remains bilateral."
      - name: Run Shakti onboarding identity-boundary contract
        run: node scripts/test-shakti-onboarding-identity-boundary-contract.mjs
      - name: Run Shakti authenticated-identity boundary contract
        run: node scripts/test-shakti-authenticated-identity-boundary-contract.mjs
      - name: Run Shakti authority boundary contract
        run: node scripts/test-shakti-authority-boundary-contract.mjs
      - name: Run Shakti authentication identity provenance contract
        run: node scripts/test-shakti-authentication-identity-provenance-contract.mjs
      - name: Run Shakti authentication session liveness contract
        run: node scripts/test-shakti-authentication-session-liveness-contract.mjs
      - name: Run Shakti high-risk organization liveness contract
        run: node scripts/test-shakti-high-risk-organization-liveness-contract.mjs
      - name: Run Shakti bilateral organization liveness contract
        run: node scripts/test-shakti-bilateral-organization-liveness-contract.mjs
      - name: Run Shakti MRV provenance deterministic-ordering contract
        run: node scripts/test-shakti-mrv-provenance-deterministic-ordering-contract.mjs
      - name: Run Shakti tenant organization liveness contract
        run: node scripts/test-shakti-tenant-organization-liveness-contract.mjs
      - name: Run Shakti auth/onboarding no-body-authority contract
        run: node scripts/test-shakti-auth-onboarding-no-body-authority-contract.mjs
      - name: Run Shakti registry active-tenant authority contract
        run: node scripts/test-shakti-registry-active-tenant-authority-contract.mjs
      - name: Run Shakti EPR return active-tenant contract
        run: node scripts/test-shakti-epr-return-active-tenant-contract.mjs
      - name: Run Shakti field-sync actor authority contract
        run: node scripts/test-shakti-field-sync-actor-authority-contract.mjs
      - name: Run Shakti active-tenant authority contract
        run: node scripts/test-shakti-active-tenant-authority-contract.mjs
      - name: Shakti registry credential tenant gate
        run: node scripts/test-shakti-registry-credential-mutation-active-tenant-contract.mjs
      - name: Run Shakti settlement active-tenant authority contract
        run: node scripts/test-shakti-settlement-active-tenant-authority-contract.mjs
      - name: Run Shakti settlement lifecycle active-tenant contract
        run: node scripts/test-shakti-settlement-lifecycle-active-tenant-contract.mjs
      - name:       - name: Run Shakti registry event tenant RLS contract
        run: node scripts/test-shakti-registry-event-tenant-rls-contract.mjs
Run Shakti settlement lifecycle integrity contract
        run: node scripts/test-shakti-settlement-lifecycle-integrity-contract.mjs
      - name: Run Shakti settlement verified-party boundary contract
        run: node scripts/test-shakti-settlement-verified-party-boundary-contract.mjs
      - name: Run Shakti verified-organization transition-lock contract
        run: node scripts/test-shakti-verified-organization-transition-lock-contract.mjs
      - name: Run Shakti settlement confirmation-reference contract
        run: node scripts/test-shakti-settlement-confirmation-reference-contract.mjs
      - name: Run Shakti settlement authorization-reference contract
        run: node scripts/test-shakti-settlement-authorization-reference-contract.mjs
      - name: Run Shakti settlement execution external-reference contract
        run: node scripts/test-shakti-settlement-execution-external-reference-contract.mjs
      - name: Run Shakti settlement reconciliation-reference integrity contract
        run: node scripts/test-shakti-settlement-reconciliation-reference-contract.mjs
      - name: Run Shakti settlement tenant RLS contract
        run: node scripts/test-shakti-settlement-tenant-rls-contract.mjs
      - name: Run Shakti settlement event append-only contract
        run: node scripts/test-shakti-settlement-event-append-only-contract.mjs
      - name: Run Shakti settlement event lifecycle uniqueness contract
        run: node scripts/test-shakti-settlement-event-lifecycle-uniqueness-contract.mjs
      - name: Run Shakti settlement event cryptographic integrity contract
        run: node scripts/test-shakti-settlement-event-cryptographic-integrity-contract.mjs
      - name: Run Shakti registry event cryptographic integrity contract
        run: node scripts/test-shakti-registry-event-cryptographic-integrity-contract.mjs
      - name: Run Shakti registry event append-only integrity contract
        run: node scripts/test-shakti-registry-event-append-only-integrity-contract.mjs
      - name: Run Shakti registry deterministic event ordering contract
        run: node scripts/test-shakti-registry-deterministic-event-ordering-contract.mjs
      - name: Run Shakti registry/settlement concurrency lock contract
        run: node scripts/test-shakti-registry-settlement-concurrency-lock-contract.mjs
      - name: Run Shakti registry lifecycle atomicity contract
        run: node scripts/test-shakti-registry-lifecycle-atomicity-contract.mjs
      - name: Run Shakti field-sync idempotency replay contract
        run: node scripts/test-shakti-field-sync-idempotency-replay-contract.mjs
      - name: Run Shakti field-sync append-only integrity contract
        run: node scripts/test-shakti-field-sync-append-only-integrity-contract.mjs
      - name: Run Shakti field-sync concurrency-conflict contract
        run: node scripts/test-shakti-field-sync-concurrency-conflict-contract.mjs
      - name: Run Shakti field-device enrollment-race contract
        run: node scripts/test-shakti-field-device-enrollment-race-contract.mjs
      - name: Run Shakti field hardware/software stack contract
        run: node scripts/test-shakti-field-hardware-stack-contract.mjs
      - name: Run Shakti open-source ecosystem contract
        run: node scripts/test-shakti-open-source-ecosystem-contract.mjs
      - name: Run Shakti context pool isolation contract
        run: node scripts/test-shakti-context-pool-isolation-contract.mjs
      - name: Run Shakti RLS write contract
        run: node scripts/test-shakti-rls-write-contract.mjs
      - name: Run Shakti SECURITY DEFINER migration contract
        run: node scripts/test-shakti-security-definer-migration-contract.mjs
      - name: Run Shakti migration integrity contract
        run: node scripts/test-shakti-migration-integrity-contract.mjs
      - name: Run Shakti protected migration gate contract
        shell: bash
        run: |
          set -euo pipefail
          for migration in 20261107_authority_hierarchy_context.sql 20261107_context_identity_bootstrap.sql 20261107_platform_execution_context.sql 20261107_runtime_grant_reconciliation.sql 20261107_context_organization_id.sql 20261107_core_tenant_rls_activation_gate.sql 20261108_context_identity_liveness_hardening.sql 20261108_context_identity_liveness_completion.sql 088_field_sync_append_only_integrity.sql 082_settlement_reference_trigger_insert_safety.sql 089_settlement_reconciliation_reference_integrity.sql 090_runtime_dml_grant_reconciliation_completion.sql 091_settlement_tenant_rls.sql 092_settlement_lifecycle_transition_integrity.sql 093_registry_event_tenant_rls.sql; do
            grep -Fq "$migration" apps/src/migrate.ts
          done
          grep -Fq 'RUPAYKG_ALLOW_PROTECTED_SHAKTI_MIGRATIONS' apps/src/migrate.ts
          echo "Shakti protected migration gate contract PASSED"
      - name: Run Shakti context function security contract
        run: node scripts/test-shakti-context-function-security-contract.mjs
      - name: Run Shakti context identity liveness contract
        run: node scripts/test-shakti-context-identity-liveness-contract.mjs
      - name: Run Shakti execution-context grant reconciliation contract
        run: node scripts/test-shakti-execution-context-grants-contract.mjs
      - name: Run Shakti runtime DML grant contract
        run: node scripts/test-shakti-runtime-dml-grants-contract.mjs
      - name: Run tests including disposable PostgreSQL acceptance
        env:
          DATABASE_URL: postgresql://rupaykg_app_runtime:ci-runtime-only-password@localhost:5432/rupaykg
          RUPAYKG_TEST_OWNER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
          RUPAYKG_RUN_DB_INTEGRATION_TESTS: "1"
          RUPAYKG_REQUIRE_NON_BYPASSRLS: "1"
        run: npm test
      - name: Build production container
        run: docker build --pull --tag rupaykg:ci .
