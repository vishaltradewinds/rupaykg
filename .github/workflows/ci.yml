name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
  DATABASE_SSL: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rupaykg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rupaykg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:migrations
      - name: Provision disposable Shakti runtime role
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "create role rupaykg_app_runtime nologin nobypassrls"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter role rupaykg_app_runtime login password 'ci-runtime-only-password'"
      - name: Assert disposable runtime role security posture
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select case when rolsuper or rolbypassrls or rolcreaterole or rolcreatedb then 1/0 else 1 end from pg_roles where rolname = 'rupaykg_app_runtime'"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select case when exists (select 1 from pg_roles where rolname = 'rupaykg_app_runtime' and rolcanlogin and not rolsuper and not rolbypassrls) then 1 else 1/0 end"
      - name: Run migrations with explicit protected-Shakti test gate
        env:
          RUPAYKG_ALLOW_PROTECTED_SHAKTI_MIGRATIONS: "1"
        run: npm run migrate -w @rupaykg/api
      - run: npm run typecheck
      - run: npm run build
      - name: Browser smoke test production web build
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -w @rupaykg/web -- --host 127.0.0.1 --port 4173 > /tmp/rupaykg-web-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          html="$(curl --fail --silent http://127.0.0.1:4173/)"
          grep -q 'id="root"' <<<"$html"
          grep -q 'assets/' <<<"$html"
          grep -q 'stakeholder-journey.js' <<<"$html"
          set +e
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome --dump-dom --virtual-time-budget=2000 http://127.0.0.1:4173/ > /tmp/rupaykg-web-dom.html 2>/tmp/rupaykg-chrome-dom.err
          dom_status=$?
          cat /tmp/rupaykg-chrome-dom.err
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --no-first-run --user-data-dir=/tmp/rupaykg-chrome-shot --hide-scrollbars --window-size=1440,1200 --screenshot=/tmp/rupaykg-web-smoke.png --virtual-time-budget=2000 http://127.0.0.1:4173/ >/tmp/rupaykg-chrome-shot.out 2>&1
          shot_status=$?
          cat /tmp/rupaykg-chrome-shot.out
          set -e
          test -s /tmp/rupaykg-web-dom.html
          grep -q 'RupayKG' /tmp/rupaykg-web-dom.html
          test -s /tmp/rupaykg-web-smoke.png
          echo "Chrome DOM exit: $dom_status; screenshot exit: $shot_status"
      - name: Run Batch E disposable policy contract
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/test-shakti-batch-e-policy-contract.sql
      - name: Run tenant-route transaction boundary contract
        run: node scripts/test-shakti-tenant-route-contract.mjs
      - name: Run Shakti operational invariants contract
        run: node scripts/test-shakti-operational-invariants.mjs
      - name: Run Shakti core RLS contract
        run: node scripts/test-shakti-core-rls-contract.mjs
      - name: Run platform-admin authorization contract
        run: node scripts/test-shakti-platform-admin-authorization-contract.mjs
      - name: Run multi-party authorization contract
        run: node scripts/test-shakti-multi-party-authorization-contract.mjs
      - name: Run tests including disposable PostgreSQL acceptance
        env:
          DATABASE_URL: postgresql://rupaykg_app_runtime:ci-runtime-only-password@localhost:5432/rupaykg
          RUPAYKG_TEST_OWNER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rupaykg
          RUPAYKG_RUN_DB_INTEGRATION_TESTS: "1"
          RUPAYKG_REQUIRE_NON_BYPASSRLS: "1"
        run: npm test
      - name: Build production container
        run: docker build --pull --tag rupaykg:ci .
