name: Shakti CI Probe

on:
  push:
    branches: [main, cto/20261107-protected-migration-ci]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Probe
        run: |
          echo "Shakti Actions execution probe"
          test -f .github/workflows/ci.yml
