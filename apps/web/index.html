<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="RupayKG — India's circular economy operating system" />
    <title>RupayKG</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="resource-flow-intake"></div>
    <div id="compliance-assessment"></div>
    <div id="esg-metrics"></div>
    <div id="bwg-reporting"></div>
    <script src="/offline-operation-queue.js"></script>
    <script>
      (() => {
        const storageKey = "rupaykg.activeOrganizationId";
        const originalFetch = window.fetch.bind(window);
        const selectedOrganization = () => window.localStorage.getItem(storageKey) || "";
        const isApiRequest = (url) => url.startsWith("/api/v1/") || url.includes("/api/v1/");
        const isAuthMeRequest = (url) => url.includes("/api/v1/auth/me");
        const isLogoutRequest = (url, method) => method.toUpperCase() === "POST" && url.includes("/api/v1/auth/logout");

        const reconcileOrganization = (body) => {
          const memberships = Array.isArray(body?.memberships) ? body.memberships : [];
          const verified = memberships.filter((membership) => membership?.status === "VERIFIED");
          const current = selectedOrganization();
          const currentIsVerified = verified.some((membership) => membership.organization_id === current);
          if (current && !currentIsVerified) window.localStorage.removeItem(storageKey);
          if (!currentIsVerified && verified[0]?.organization_id) window.localStorage.setItem(storageKey, verified[0].organization_id);
        };

        window.fetch = async (input, init) => {
          const url = typeof input === "string" ? input : input.url;
          const method = init?.method || (input instanceof Request ? input.method : "GET");
          const organizationId = selectedOrganization();
          let args = [input, init];
          if (isLogoutRequest(url, method)) window.localStorage.removeItem(storageKey);
          if (organizationId && isApiRequest(url) && !isAuthMeRequest(url) && !isLogoutRequest(url, method)) {
            const headers = new Headers(init?.headers || (input instanceof Request ? input.headers : undefined));
            // Never overwrite an explicitly supplied organization context. The backend's
            // active-organization authorization remains authoritative and fail-closed.
            if (!headers.has("X-RupayKG-Organization-Id")) headers.set("X-RupayKG-Organization-Id", organizationId);
            args = [input, { ...(init || {}), headers }];
          }
          const response = await originalFetch(args[0], args[1]);
          if (isAuthMeRequest(url)) {
            if (response.status === 401 || response.status === 403) window.localStorage.removeItem(storageKey);
            else response.clone().json().then(reconcileOrganization).catch(() => undefined);
          }
          return response;
        };

        const syncOrganizationSelection = (select) => {
          if (!select?.value) return;
          window.localStorage.setItem(storageKey, select.value);
        };
        const observer = new MutationObserver(() => {
          const select = document.querySelector('select[aria-label="Active organization"]');
          if (!select) return;
          if (!selectedOrganization()) syncOrganizationSelection(select);
          if (select.dataset.rupaykgOrganizationBound === "true") return;
          select.dataset.rupaykgOrganizationBound = "true";
          select.addEventListener("change", () => {
            syncOrganizationSelection(select);
            const refresh = Array.from(document.querySelectorAll("button")).find((button) => button.textContent?.trim() === "Refresh");
            refresh?.click();
          });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });

        const status = document.createElement("div");
        status.id = "rupaykg-offline-status";
        status.setAttribute("role", "status");
        status.setAttribute("aria-live", "polite");
        Object.assign(status.style, { position: "fixed", right: "14px", bottom: "14px", zIndex: "20", maxWidth: "min(360px,calc(100vw - 28px))", padding: "9px 12px", border: "1px solid #314c63", borderRadius: "999px", background: "rgba(7,17,31,.94)", color: "#a8bbcb", font: "600 11px system-ui,sans-serif", boxShadow: "0 8px 30px rgba(0,0,0,.28)", pointerEvents: "none" });
        document.body.appendChild(status);

        const setStatus = (text) => { status.textContent = text; status.hidden = !text; };
        const refreshQueueStatus = async () => {
          try {
            const db = await new Promise((resolve, reject) => {
              const request = indexedDB.open("rupaykg-field-operations", 3);
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            const count = await new Promise((resolve, reject) => {
              const tx = db.transaction("pending", "readonly");
              const request = tx.objectStore("pending").count();
              request.onsuccess = () => resolve(request.result);
              request.onerror = () => reject(request.error);
            });
            db.close();
            if (count > 0) setStatus(`${count} field operation${count === 1 ? "" : "s"} pending sync`);
            else if (navigator.onLine) setStatus("");
          } catch { setStatus(""); }
        };
        window.addEventListener("offline", () => setStatus("Offline — new field operations will be queued"));
        window.addEventListener("online", () => { setStatus("Back online — syncing field operations"); void refreshQueueStatus(); });
        window.addEventListener("rupaykg:offline-sync", (event) => {
          const detail = event.detail || {};
          if (detail.status === "QUEUED") setStatus("Field operation queued — pending authoritative sync");
          else if (detail.status === "SYNCED") { setStatus("Field operation synced and accepted"); setTimeout(() => void refreshQueueStatus(), 1200); }
          else if (detail.status === "REJECTED") setStatus(`Field operation rejected by API (${detail.httpStatus ?? "4xx"})`);
        });
        void refreshQueueStatus();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/resource-flow-panel.ts"></script>
    <script type="module" src="/src/compliance-panel.ts"></script>
    <script type="module" src="/src/esg-panel.ts"></script>
    <script type="module" src="/src/bwg-reporting-panel.ts"></script>
  </body>
</html>
