<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="RupayKG — India's circular economy operating system" />
    <title>RupayKG</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="resource-flow-intake"></div>
    <div id="compliance-assessment"></div>
    <div id="esg-metrics"></div>
    <div id="bwg-reporting"></div>
    <script>
      (() => {
        const storageKey = "rupaykg.activeOrganizationId";
        const workspacePrefix = "/api/v1/workspaces/";
        const originalFetch = window.fetch.bind(window);

        const selectedOrganization = () => window.localStorage.getItem(storageKey) || "";
        const withOrganizationHeader = (input, init) => {
          const organizationId = selectedOrganization();
          if (!organizationId) return [input, init];
          const headers = new Headers(init?.headers || (input instanceof Request ? input.headers : undefined));
          headers.set("X-RupayKG-Organization-Id", organizationId);
          return [input, { ...(init || {}), headers }];
        };

        window.fetch = async (input, init) => {
          const url = typeof input === "string" ? input : input.url;
          const isWorkspaceRequest = url.startsWith(workspacePrefix) || url.includes(workspacePrefix);
          const args = isWorkspaceRequest ? withOrganizationHeader(input, init) : [input, init];
          const response = await originalFetch(args[0], args[1]);
          if (url.includes("/api/v1/auth/me")) {
            response.clone().json().then((body) => {
              const verified = Array.isArray(body?.memberships)
                ? body.memberships.find((membership) => membership?.status === "VERIFIED")
                : null;
              if (verified?.organization_id && !selectedOrganization()) {
                window.localStorage.setItem(storageKey, verified.organization_id);
              }
            }).catch(() => undefined);
          }
          return response;
        };

        const syncOrganizationSelection = (select) => {
          if (!select?.value) return;
          window.localStorage.setItem(storageKey, select.value);
        };

        const observer = new MutationObserver(() => {
          const select = document.querySelector('select[aria-label="Active organization"]');
          if (!select) return;
          if (!selectedOrganization()) syncOrganizationSelection(select);
          if (select.dataset.rupaykgOrganizationBound === "true") return;
          select.dataset.rupaykgOrganizationBound = "true";
          select.addEventListener("change", () => {
            syncOrganizationSelection(select);
            const refresh = Array.from(document.querySelectorAll("button")).find((button) => button.textContent?.trim() === "Refresh");
            refresh?.click();
          });
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module" src="/src/resource-flow-panel.ts"></script>
    <script type="module" src="/src/compliance-panel.ts"></script>
    <script type="module" src="/src/esg-panel.ts"></script>
    <script type="module" src="/src/bwg-reporting-panel.ts"></script>
  </body>
</html>
