<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <meta name="description" content="RupayKG — India's circular economy operating system" />
    <title>RupayKG</title>
    <link rel="stylesheet" href="/minimal-stakeholder.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/offline-operation-queue.js"></script>
    <script>
      (()=>{const storageKey="rupaykg.activeOrganizationId",originalFetch=window.fetch.bind(window),selectedOrganization=()=>window.localStorage.getItem(storageKey)||"",isApiRequest=url=>url.startsWith("/api/v1/")||url.includes("/api/v1/"),isAuthMeRequest=url=>url.includes("/api/v1/auth/me"),isLogoutRequest=(url,method)=>method.toUpperCase()==="POST"&&url.includes("/api/v1/auth/logout"),reconcileOrganization=body=>{const verified=(Array.isArray(body?.memberships)?body.memberships:[]).filter(m=>m?.status==="VERIFIED"),current=selectedOrganization();if(current&&!verified.some(m=>m.organization_id===current))window.localStorage.removeItem(storageKey);if(!verified.some(m=>m.organization_id===current)&&verified[0]?.organization_id)window.localStorage.setItem(storageKey,verified[0].organization_id)};window.fetch=async(input,init)=>{const url=typeof input==="string"?input:input.url,method=init?.method||(input instanceof Request?input.method:"GET"),organizationId=selectedOrganization();let args=[input,init];if(isLogoutRequest(url,method))window.localStorage.removeItem(storageKey);if(organizationId&&isApiRequest(url)&&!isAuthMeRequest(url)&&!isLogoutRequest(url,method)){const headers=new Headers(init?.headers||(input instanceof Request?input.headers:undefined));if(!headers.has("X-RupayKG-Organization-Id"))headers.set("X-RupayKG-Organization-Id",organizationId);args=[input,{...(init||{}),headers}]}const response=await originalFetch(args[0],args[1]);if(isAuthMeRequest(url)){if(response.status===401||response.status===403)window.localStorage.removeItem(storageKey);else response.clone().json().then(reconcileOrganization).catch(()=>undefined)}return response};const status=document.createElement("button");status.id="rupaykg-offline-status";status.type="button";status.setAttribute("aria-live","polite");Object.assign(status.style,{position:"fixed",right:"14px",bottom:"14px",zIndex:"20",maxWidth:"min(420px,calc(100vw - 28px))",padding:"9px 12px",border:"1px solid #314c63",borderRadius:"12px",background:"rgba(7,17,31,.96)",color:"#a8bbcb",font:"600 11px system-ui,sans-serif",boxShadow:"0 8px 30px rgba(0,0,0,.28)",textAlign:"left"});document.body.appendChild(status);const setStatus=text=>{status.textContent=text;status.hidden=!text};window.addEventListener("offline",()=>setStatus("Offline — new field operations will be queued"));window.addEventListener("online",()=>setStatus("Back online"));})();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/citizen-assistance.js"></script><script src="/national-language-selector.js"></script><script src="/role-dashboard.js"></script><script src="/stakeholder-journey.js"></script>
  </body>
</html>
