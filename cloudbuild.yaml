steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/rupaykg/rupaykg:${COMMIT_SHA}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/rupaykg/rupaykg:${COMMIT_SHA}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/rupaykg/rupaykg:${COMMIT_SHA}

substitutions:
  _REGION: asia-south1

options:
  logging: CLOUD_LOGGING_ONLY
