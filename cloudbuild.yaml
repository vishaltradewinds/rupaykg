steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        for value in \
          "${_VITE_FIREBASE_API_KEY}" \
          "${_VITE_FIREBASE_AUTH_DOMAIN}" \
          "${_VITE_FIREBASE_PROJECT_ID}" \
          "${_VITE_FIREBASE_APP_ID}"; do
          if [[ -z "$value" || "$value" == REPLACE_WITH_* ]]; then
            echo "ERROR: production build requires real Firebase web configuration; placeholder or empty value detected."
            exit 1
          fi
        done

        if [[ "${_VITE_FIREBASE_PROJECT_ID}" != "${PROJECT_ID}" ]]; then
          echo "ERROR: Firebase project ID must match the Google Cloud project being built."
          echo "       Cloud Build project: ${PROJECT_ID}"
          echo "       Firebase project:    ${_VITE_FIREBASE_PROJECT_ID}"
          exit 1
        fi

        echo "Firebase production build configuration validation passed."

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --pull
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/rupaykg/rupaykg:${COMMIT_SHA}
      - --build-arg
      - VITE_FIREBASE_API_KEY=${_VITE_FIREBASE_API_KEY}
      - --build-arg
      - VITE_FIREBASE_AUTH_DOMAIN=${_VITE_FIREBASE_AUTH_DOMAIN}
      - --build-arg
      - VITE_FIREBASE_PROJECT_ID=${_VITE_FIREBASE_PROJECT_ID}
      - --build-arg
      - VITE_FIREBASE_APP_ID=${_VITE_FIREBASE_APP_ID}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/rupaykg/rupaykg:${COMMIT_SHA}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/rupaykg/rupaykg:${COMMIT_SHA}

substitutions:
  _REGION: asia-south1
  # Intentionally blank: production deployments must provide the Firebase web app config.
  # Never commit production credentials or rely on placeholder defaults.
  _VITE_FIREBASE_API_KEY: ""
  _VITE_FIREBASE_AUTH_DOMAIN: ""
  _VITE_FIREBASE_PROJECT_ID: ""
  _VITE_FIREBASE_APP_ID: ""

options:
  logging: CLOUD_LOGGING_ONLY
