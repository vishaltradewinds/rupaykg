services:
  - type: web
    name: rupaykg-production
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL
        value: require
      - key: RUPAYKG_AUTH_MODE
        value: real
      - key: RUPAYKG_SYNTHETIC_DATA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CA_CERT
        sync: false
      - key: RUPAYKG_ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: GUARDIAN_MRV_SUBMIT_URL
        sync: false
      - key: GUARDIAN_MRV_POLICY_ID
        sync: false
      - key: GUARDIAN_API_TOKEN
        sync: false
      - key: HEDERA_NETWORK
        value: testnet
      - key: HEDERA_TOPIC_ID
        sync: false
      - key: HEDERA_OPERATOR_ID
        sync: false
      - key: HEDERA_OPERATOR_KEY
        sync: false
